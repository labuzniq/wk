name: check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # The kit targets macOS: its scripts use the macOS forms of stat and shasum.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: brew install bats-core shellcheck
      - run: test/run

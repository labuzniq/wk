# Starter checks for Swift, run by the lint task in mise.toml. Each rule is explained in swift.txt.
# Paths are relative to this file.
only_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - custom_rules
excluded:
  - ../../.build
  - ../../DerivedData
  - ../../Pods
custom_rules:
  empty_catch:
    name: "Empty catch"
    regex: 'catch\s*(\([^)]*\)\s*)?\{\s*\}'
    message: "An empty `catch` makes the error disappear. Handle the error, throw it again, or log it with the reason it is safe to ignore."
  debug_print:
    name: "Debug print"
    regex: '\b(print|debugPrint|dump)\('
    match_kinds: identifier
    message: "A `print` left in the code. Delete it, or log through `Logger` (import os) when the line is worth keeping."
